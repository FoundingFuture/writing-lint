" " = { name = "non-breaking space", fix = "a regular space" }
"→" = { name = "arrow glyph", fix = "a word" }
"←" = { name = "arrow glyph", fix = "a word" }
"✓" = { name = "check glyph", fix = "a word" }
"✗" = { name = "cross glyph", fix = "a word" }
"•" = { name = "bullet glyph", fix = "a list item" }
"★" = { name = "star glyph", fix = "a word" }
"⚠" = { name = "warning glyph", fix = "the word Warning" }


