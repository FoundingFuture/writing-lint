[[web_content.constructs]]
rule = "contrast"
level = "error"
ignorecase = true
method = "search"
message = "contrast frame (not X, it is Y). State Y."
pattern = '''\b(is|are|was|were|it's|isn't|aren't|wasn't|weren't|not)\s+not\s+(a|an|the|about|just|only|merely|simply)?\s*\w[\w\s-]{0,40}?[,.;]\s*(it|this|that|they)\s+(is|are|was|were|'s)\b'''

[[web_content.constructs]]
rule = "contrast"
level = "error"
ignorecase = true
method = "search"
message = "contrast frame (not a X, a Y). State Y."
pattern = '''\bnot\s+(a|an|the)\s+[\w-]+(\s+[\w-]+)?\s*[,.]\s*(but|a|an|the)\s+'''

[[web_content.constructs]]
rule = "contrast"
level = "error"
ignorecase = true
method = "search"
message = "negated opener (this is not about X). State what it is about."
pattern = '''\b(this|that|it)\s+(is|was|isn't|wasn't)\s+(not\s+)?(about|a matter of)\b'''

[[web_content.constructs]]
rule = "comparison"
level = "error"
ignorecase = true
method = "search"
message = "comparison frame (most X do A). Say what this one does."
pattern = '''\b(most|many|other|typical|traditional|conventional|ordinary|standard)\s+\w+(\s+\w+)?\s+(assume|assumes|do|does|treat|treats|expect|expects|use|uses|rely|relies|start|starts|make|makes|require|requires|ship|ships|guess|guesses|hide|hides)\b'''

[[web_content.constructs]]
rule = "comparison"
level = "error"
ignorecase = true
method = "search"
message = "comparison frame (this one does B). Name the thing and state the fact."
pattern = '''\b(this one|this theme|this tool|this site|this page|this script|this plugin|this library|ours)\s+(assumes|does|treats|expects|uses|relies|starts|makes|requires|ships|measures|doesn't|does not)\b'''

[[web_content.constructs]]
rule = "comparison"
level = "error"
ignorecase = true
method = "search"
message = "foil setup (where others X). Delete the foil."
pattern = '''^\s*(where|while|whereas|unlike)\s+(other|most|many|typical|traditional)\b'''

[[web_content.constructs]]
rule = "instead"
level = "error"
ignorecase = true
method = "search"
message = "instead frame. State what happened."
pattern = '''\binstead of being\b|\brather than being\b|\bwent away instead\b'''

[[web_content.constructs]]
rule = "triplet"
level = "error"
ignorecase = true
method = "search"
message = "rule of three closing a sentence. Keep one measured fact."
pattern = '''\b[\w-]+,\s+[\w-]+,?\s+(and|or)\s+[\w-]+[.!?]'''

[[web_content.constructs]]
rule = "question-reveal"
level = "error"
ignorecase = false
method = "search"
message = "question and reveal (The result? X). State X."
pattern = '''\b(the|a|its|their)\s+\w+(\s+\w+)?\?\s+[A-Z]'''

[[web_content.constructs]]
rule = "colon-reveal"
level = "error"
ignorecase = false
method = "search"
message = "colon reveal (short clause: payload). Write one sentence."
pattern = '''(^|[.!?]\s+)([A-Z]\w*(\s+\w+){0,5}):\s+[a-z][^,:.!?]{0,40}[.!?](\s|$)'''

[[web_content.constructs]]
rule = "litotes"
level = "error"
ignorecase = true
method = "search"
message = "litotes (not a small X). Say what it is."
pattern = '''\b(not|no)\s+(a\s+)?(small|minor|trivial|difficult|hard|uncommon|unusual|accident|coincidence)\b'''

[[web_content.constructs]]
rule = "participial-tail"
level = "error"
ignorecase = true
method = "search"
message = "participial tail. New sentence, or delete."
pattern = ''',\s+(ensuring|highlighting|underscoring|emphasizing|reflecting|symbolizing|showcasing|fostering|contributing|cultivating|encompassing|marking|setting the stage|paving the way)\b'''

[[web_content.constructs]]
rule = "announced-count"
level = "error"
ignorecase = true
method = "search"
message = "announced count. Use headings, not a promise."
pattern = '''\b(two|three|four|five|3|4|5)\s+(things|reasons|lessons|caveats|points|ways|takeaways|problems|questions)\b'''

[[web_content.constructs]]
rule = "invented-label"
level = "error"
ignorecase = true
method = "search"
message = "invented label (the X paradox). Describe the behavior."
pattern = '''\bthe\s+\w+\s+(paradox|trap|problem|gap|tax|creep|effect)\b'''

[[web_content.constructs]]
rule = "aphorism"
level = "error"
ignorecase = false
method = "search"
message = "aphorism (X is the Y of Z). Delete."
pattern = '''\b[A-Z]\w+\s+is\s+the\s+\w+\s+of\s+\w+\.'''

[[web_content.constructs]]
rule = "suspense"
level = "error"
ignorecase = true
method = "search"
message = "suspense hook. Give the name."
pattern = '''\bhas\s+a\s+name\.|\bthere\s+is\s+a\s+(word|name|term)\s+for\s+(this|that)\b'''

[[web_content.constructs]]
rule = "worth-gerund"
level = "error"
ignorecase = true
method = "search"
message = "worth + gerund. Delete the marker and keep the fact."
pattern = '''\bworth\s+\w+ing\b'''

[[web_content.constructs]]
rule = "narration"
level = "error"
ignorecase = true
method = "search"
message = "process narration. State the finding, not the story."
pattern = '''\b(for about a (day|week|month|year)|at first|initially|then i\b|so i\b|i (read|set|tried|found|wrote|decided|noticed|realized|realised|started|spent|ended up|went|switched|picked|chose|wanted|thought))\b'''

[[web_content.constructs]]
rule = "reader"
level = "warning"
ignorecase = true
method = "search"
message = "reader address or inclusive we. Third person."
pattern = '''\b(you|your|you're|you'll|yourself|we|we're|we'll|our|ours|let's)\b'''

[[web_content.constructs]]
rule = "contraction"
level = "warning"
ignorecase = true
method = "search"
message = "contraction. Use the full form."
pattern = '''\b\w+n't\b|\b(it|that|there|he|she|what|who)'s\b|\b\w+'(ll|re|ve|d)\b'''

[[web_content.constructs]]
rule = "unsupported-step"
level = "error"
ignorecase = true
method = "search"
message = "unsupported step. Write the step, or the number."
pattern = '''\b(it follows that|it is easy to see|clearly|obviously|evidently|trivially|of course|needless to say)\b'''

[[web_content.constructs]]
rule = "false-range"
level = "error"
ignorecase = true
method = "search"
message = "stacked false range (from X to Y, from A to B). List the items."
pattern = '''\bfrom\s+(the\s+)?\w+(\s+\w+)?\s+to\s+(the\s+)?\w+(\s+\w+)?,\s+from\b'''


[docs]
words = [
  "basically", "fundamentally", "seamlessness", "simply",
]

phrases = [
  "out of the box", "this class", "this file", "this function", "this method",
  "this module", "this script",
]

context = [
  "notably",
]

# The docs checker reads identifiers constantly. A term is bounded by
# word characters only, so it may sit next to a hyphen.
boundary = "word"

[docs.limits]
max_sentence_words = 20
max_heading_depth = 3
title_case_min = 3

[docs.headings]
filler = [
  "introduction",
  "overview",
  "conclusion",
  "summary",
  "final thoughts",
  "wrapping up",
  "closing thoughts",
]

[docs.caps]
# A run of shouted words is emphasis. These tags are not.
allow = [
  "BUG", "FIXME", "HACK", "NOTE", "SAFETY", "TODO", "WARNING", "XXX",
]


[[docs.constructs]]
rule = "opener"
level = "error"
ignorecase = true
method = "match"
message = "subject-restating opener. Start with the verb."
pattern = '''^\s*(this\s+(function|method|class|module|script|file|helper|utility)\b|the\s+purpose\s+of\s+this\b|a\s+(function|method|class)\s+(that|which)\b)'''
